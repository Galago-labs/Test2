name: Build Android (RuStore / Google Play)

# Runs on GitHub's own servers — real internet access to Google's Maven and
# Yandex's SDK, unlike local sandboxed testing. Two ways to trigger it:
#   - automatically, on every push that touches the web game or the native project
#   - manually, from the Actions tab ("Run workflow"), which is the one that
#     also offers to produce a signed release build (see below)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'native/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: 'Also build a signed release AAB (needs the signing secrets configured — see native/README.md)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # --- Step 1: build the web game itself (same thing `npm run build`
      # does locally) — the native project just wraps whatever is in dist/. ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install web game dependencies
        run: npm ci

      - name: Type-check the web game
        run: npm run typecheck

      - name: Build the web game (produces dist/)
        run: npm run build

      - name: Run the web game's own test suite
        run: npm test

      # --- Step 2: the native Android wrapper ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit on purpose: this action's own default ("tools
          # platform-tools") requests the legacy 'tools' SDK package, which
          # Google stopped serving on 2026-09-15 — sdkmanager now hard-fails
          # asking for it, breaking this step before any build code runs.
          # We only need adb-adjacent platform-tools here (no emulator, no
          # instrumented tests); Gradle/AGP resolves whatever build-tools
          # and platform version compileSdk actually needs on its own once
          # the SDK licenses are accepted, which this action still does
          # regardless of this input. Do not remove this override — it's
          # what keeps this step from breaking again the next time the
          # action's own default package list changes.
          packages: 'platform-tools'

      - name: Install native project dependencies
        working-directory: native
        run: npm ci

      - name: Strip the web build to a single self-contained index.html, then sync into the Android project
        working-directory: native
        run: npm run sync

      - name: Make sure gradlew is executable
        # Not redundant with anything upstream: git only tracks the
        # executable bit if it was set at commit time, and it's easy to
        # lose — e.g. extracting/committing this project from a zip on
        # Windows, or various editors/zip tools that don't preserve Unix
        # file modes. Rather than rely on the checked-in bit surviving
        # every such round trip, just set it fresh here every run. This
        # is the actual fix for "./gradlew: Permission denied" (exit 126);
        # it is not something Gradle or the Android SDK setup step affects.
        working-directory: native/android
        run: chmod +x gradlew

      - name: Build debug APK (always — good for installing on a device/emulator to sanity-check)
        working-directory: native/android
        run: ./gradlew assembleDebug

      # Gradle always names its output <module>-<buildType>.apk, and the module is
      # called "app" — hence app-debug.apk. That is only a file name (the app's
      # real name on the phone comes from strings.xml), but we hand people a
      # properly named, versioned copy instead.
      - name: Give the build files proper names
        id: names
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' native/android/app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' native/android/app/build.gradle)
          echo "label=MomoDreams-v${VERSION}-code${CODE}" >> "$GITHUB_OUTPUT"
          mkdir -p out/debug
          cp native/android/app/build/outputs/apk/debug/app-debug.apk "out/debug/MomoDreams-v${VERSION}-code${CODE}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: momodreams-debug-apk
          path: out/debug/*.apk

      # --- Step 3 (optional, manual only): a real signed release build ---
      # Only runs if you tick the box when manually running this workflow AND
      # you've added the four signing secrets in this repo's Settings ->
      # Secrets and variables -> Actions. See native/README.md for exactly
      # what to generate and upload. Skipped entirely otherwise — the debug
      # APK above still gets built either way.
      # Fails early, with a plain message, if a secret is missing or the keystore cannot
      # be opened — instead of an obscure Gradle error later. Nothing secret is printed.
      - name: Check the signing secrets and decode the release keystore
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        working-directory: native/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These GitHub secrets are missing or empty:$missing. If you have no signing key yet, run the workflow \"Create signing key (run once)\" first; the steps are in native/README.md (\"Signing\")."
            exit 1
          fi
          # The key created by that workflow uses this alias and one password; secrets for
          # RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD are only needed for a key made some other way.
          ALIAS="${RELEASE_KEY_ALIAS:-momodreams}"
          # Gradle needs an ABSOLUTE path here: a bare file name is looked up in Gradle's own
          # daemon folder, not in the project, and the build fails with "Keystore file not found".
          KEYSTORE_PATH="$PWD/app/release.keystore"
          # Text copied from Windows often carries line breaks or spaces; they are not part of the data.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_PATH" || {
            echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64. Re-create it from the .keystore file (see native/README.md)."; exit 1; }
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$RELEASE_STORE_PASSWORD" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with RELEASE_STORE_PASSWORD (and the alias). Check that the password is exactly the one used when the key was created."; exit 1
          fi
          echo "Keystore decoded and opened successfully."
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release AAB (for Google Play) and APK (for RuStore)
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        working-directory: native/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ALIAS="${RELEASE_KEY_ALIAS:-momodreams}"
          KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Give the release files proper names
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        run: |
          mkdir -p out/release
          cp native/android/app/build/outputs/bundle/release/*.aab "out/release/${{ steps.names.outputs.label }}-release.aab"
          cp native/android/app/build/outputs/apk/release/*.apk "out/release/${{ steps.names.outputs.label }}-release.apk"

      - name: Upload signed release build (AAB for Google Play, APK for RuStore)
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: momodreams-release-signed
          path: |
            out/release/*.aab
            out/release/*.apk

      - name: Remove the decoded keystore (never leave it in the runner's workspace)
        if: always()
        working-directory: native/android
        run: rm -f app/release.keystore
