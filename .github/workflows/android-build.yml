name: Build Android (RuStore / Google Play)

# Runs on GitHub's own servers — real internet access to Google's Maven and
# Yandex's SDK, unlike local sandboxed testing. Two ways to trigger it:
#   - automatically, on every push that touches the web game or the native project
#   - manually, from the Actions tab ("Run workflow"), which is the one that
#     also offers to produce a signed release build (see below)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'native/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: 'Also build a signed release AAB (needs the signing secrets configured — see native/README.md)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # --- Step 1: build the web game itself (same thing `npm run build`
      # does locally) — the native project just wraps whatever is in dist/. ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install web game dependencies
        run: npm ci

      - name: Build the web game (produces dist/)
        run: npm run build

      - name: Run the web game's own test suite
        run: node --test --experimental-strip-types tests/*.ts

      # --- Step 2: the native Android wrapper ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit on purpose: this action's own default ("tools
          # platform-tools") requests the legacy 'tools' SDK package, which
          # Google stopped serving on 2026-09-15 — sdkmanager now hard-fails
          # asking for it, breaking this step before any build code runs.
          # We only need adb-adjacent platform-tools here (no emulator, no
          # instrumented tests); Gradle/AGP resolves whatever build-tools
          # and platform version compileSdk actually needs on its own once
          # the SDK licenses are accepted, which this action still does
          # regardless of this input. Do not remove this override — it's
          # what keeps this step from breaking again the next time the
          # action's own default package list changes.
          packages: 'platform-tools'

      - name: Install native project dependencies
        working-directory: native
        run: npm ci

      - name: Strip the web build to a single self-contained index.html, then sync into the Android project
        working-directory: native
        run: npm run sync

      - name: Make sure gradlew is executable
        # Not redundant with anything upstream: git only tracks the
        # executable bit if it was set at commit time, and it's easy to
        # lose — e.g. extracting/committing this project from a zip on
        # Windows, or various editors/zip tools that don't preserve Unix
        # file modes. Rather than rely on the checked-in bit surviving
        # every such round trip, just set it fresh here every run. This
        # is the actual fix for "./gradlew: Permission denied" (exit 126);
        # it is not something Gradle or the Android SDK setup step affects.
        working-directory: native/android
        run: chmod +x gradlew

      - name: Build debug APK (always — good for installing on a device/emulator to sanity-check)
        working-directory: native/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: little-pause-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk

      # --- Step 3 (optional, manual only): a real signed release build ---
      # Only runs if you tick the box when manually running this workflow AND
      # you've added the four signing secrets in this repo's Settings ->
      # Secrets and variables -> Actions. See native/README.md for exactly
      # what to generate and upload. Skipped entirely otherwise — the debug
      # APK above still gets built either way.
      - name: Decode the release keystore
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        working-directory: native/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release AAB (for Google Play) and APK (for RuStore)
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        working-directory: native/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - name: Upload signed release build (AAB for Google Play, APK for RuStore)
        if: ${{ github.event.inputs.build_signed_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: little-pause-release-signed
          path: |
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/apk/release/*.apk

      - name: Remove the decoded keystore (never leave it in the runner's workspace)
        if: always()
        working-directory: native/android
        run: rm -f app/release.keystore
