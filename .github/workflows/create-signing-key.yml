name: Create signing key (run once)

# Android stores only accept an app that carries its author's digital signature, and
# every update must carry the SAME signature. This creates that signature (a file
# called a keystore) on GitHub's own servers — nothing needs installing on your computer.
#
# Run it ONCE, from the Actions tab > "Create signing key (run once)" > Run workflow,
# after creating the secret RELEASE_STORE_PASSWORD (see native/README.md, "Signing").
on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create the signing key
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # A second key would make it impossible to update an app that is already published.
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::A signing key is already stored in this repository (secret RELEASE_KEYSTORE_BASE64). Creating another would make it impossible to update the published app. If you really need a new one, delete that secret first."
            exit 1
          fi
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::error::First create the secret RELEASE_STORE_PASSWORD (Settings > Secrets and variables > Actions > New repository secret): any long password you invent and write down. Then run this again."
            exit 1
          fi
          if [ "${#RELEASE_STORE_PASSWORD}" -lt 12 ]; then
            echo "::error::The password in RELEASE_STORE_PASSWORD is too short. Use at least 12 characters (letters and digits are fine)."
            exit 1
          fi
          mkdir key
          # Valid for about 27 years (stores want at least 25). One password protects the file and the key.
          keytool -genkeypair -storetype PKCS12 -keystore key/release.keystore -alias momodreams \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_STORE_PASSWORD" \
            -dname "CN=Oriby Games, O=Oriby Games"
          # The same file as one line of text, ready to paste into the second secret.
          base64 -w0 key/release.keystore > key/RELEASE_KEYSTORE_BASE64.txt
          cat > key/READ-ME.txt <<'EOF'
          WHAT THIS IS
          release.keystore is the digital signature ("stamp") of your app. The stores check that
          every update carries the same one. It is protected by the password you stored in the
          secret RELEASE_STORE_PASSWORD.

          WHAT TO DO NOW
          1. Open RELEASE_KEYSTORE_BASE64.txt, select ALL the text and copy it.
          2. On GitHub: Settings > Secrets and variables > Actions > New repository secret.
             Name: RELEASE_KEYSTORE_BASE64     Secret: paste the text.
          3. Save release.keystore AND your password somewhere safe that is NOT this repository
             (a cloud drive, a USB stick, your email to yourself). GitHub deletes this download
             in 14 days and never shows a secret again. Lose the file or the password and the
             published app can no longer be updated under the same name.
          4. Never publish these files anywhere.
          EOF
          echo "The signing key was created. Download it from the Artifacts section below."

      - name: Upload the key (download it now, it is deleted in 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: momodreams-signing-key
          path: key/
          retention-days: 14
