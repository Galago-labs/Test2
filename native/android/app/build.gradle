apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.littlepause.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.littlepause.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Required by the Yandex Mobile Ads SDK.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    // Populated by the injected -Pandroid.injected.signing.* properties the
    // GitHub Actions workflow passes on the command line — never hardcode
    // real passwords here. If those properties aren't set (e.g. a plain
    // local build), this config is simply incomplete and release builds fall
    // back to being unsigned, which Gradle will clearly complain about
    // rather than silently doing the wrong thing.
    signingConfigs {
        release {
            storeFile file(project.findProperty('android.injected.signing.store.file') ?: 'release.keystore')
            storePassword project.findProperty('android.injected.signing.store.password')
            keyAlias project.findProperty('android.injected.signing.key.alias')
            keyPassword project.findProperty('android.injected.signing.key.password')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('android.injected.signing.store.password') ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Not RuStore-vs-GooglePlay specific — the same Yandex Mobile Ads SDK build
    // supports both, per https://yandex.com/dev/mobile-ads/ . Confirmed current
    // as 8.4.0 against the official SDK 8 docs as of this check — check
    // https://ads.yandex.com/helpcenter/en/dev/android/quick-start for anything
    // newer before you build; release builds fail their lint check if this is
    // outdated (Yandex enforces this on purpose to protect your ad revenue).
    // That same page also now requires Android Gradle Plugin 8.7.0+ and
    // compileSdk 35+ — both already satisfied here (AGP 8.13.0, compileSdk 36
    // in variables.gradle).
    implementation "com.yandex.android:mobileads:8.4.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
